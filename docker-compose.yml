services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"   # FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_healthy
